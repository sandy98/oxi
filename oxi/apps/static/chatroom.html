<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Oxi Chat Room</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <!--[if lt IE 9]><script src="js/html5shiv-printshiv.js" media="all"></script><![endif]-->
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 120%;
    }
    .steelblue {
        color: steelblue;
    }
    .centered {
        text-align: center;
    }
    .viewport {
        display: flex;
        flex-direction: column;
        justify-content: stretch;
        padding: 15px;
        margin-left: 5%;
        border: solid 1px;
        border-radius: 8px;
        width: 90%;
        min-width: 90%;
        max-width: 90%;
        height: 35rem;
        min-height: 35rem;
        max-height: 35rem;
        background-color: whitesmoke;
    }
    .listcontainer {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        width: 100%;
        min-width: 100%;
        max-width: 100%;
        height: 75%;
        min-height: 75%;
        max-height: 75%;
        background-color: transparent;
    }
    .msgcontainer {
        width: 70%;
        min-width: 70%;
        max-width: 70%;
        height: 100%;
        min-height: 100%;
        max-height: 100%;
/*        background-color:#f0f8ff; aliceblue; */
        background-color: #f8f8f8;
        border: solid 1px;
        overflow-y: scroll;
        text-align: left;
        text-wrap: wrap;
        padding-left: 10px;

    }
    .usercontainer>p, .msgcontainer>p {
        height: 0.5rem;
        min-height: 0.5em;
        max-height: 1.5em;
    }
    .usercontainer {
        width: 20%;
        min-width: 20%;
        max-width: 20%;
        height: 100%;
        min-height: 100%;
        max-height: 100%;
        background-color: white;
        border: solid 1px;
        overflow-y: scroll;
        text-align: left;
        text-wrap: wrap;
        padding-left: 10px;
    }
    .shift10 {
        margin-top: 10px;
    }

</style>
</head>
<body>
    <h2 class="centered steelblue">Oxi Chat Room</h2>
    <!--<hr>-->
    <div class="viewport">
        <div class="listcontainer">
            <div class="msgcontainer" id="msgcontainer"></div>
            <div class="usercontainer" id="usercontainer"></div>
        </div>
        <form>
            <div class="shift10">
                <label for="msgtxt" class="steelblue">Message: </label>
                <input type="text" id="msgtxt" style="width: 63.5%; height: 2em;"/>
            </div>
        </form>
        <div class="shift10">
            <label for="msgcolor" class="steelblue">User color: </label>
            <input type="color" value="#008000" id="msgcolor">
        </div>
        <div class="centered shift10">
            <button onclick="location.href='/';">Home</button>
        </div>
    </div>
    <script src="js/chat.js"></script>
</body>
</html>
