[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxi"
dynamic = ["version", "readme"] # Removed "description" and "authors" from dynamic
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
description = "A high-performance, polyglot ASGI/WSGI web engine (C++, Julia, Python)."
authors = [
    {name = "Domingo E. Savoretti", email = "esavoretti@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
uvloop = [
    "uvloop>=0.17.0"
]

[project.scripts]
oxiserver = "oxi.server:main"
oxibuild = "oxi.build_binary:main"
mp4parser = "oxi.mp4parser:main"


[tool.setuptools.dynamic]
version = {attr = "oxi.__about__.__version__"}
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools.packages.find]
include = ["oxi*"]